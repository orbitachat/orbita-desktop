<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/icons/icon.ico" />
  <title>Orbita Notification</title>
  <style>
    @font-face {
      font-family: 'Apple Color Emoji';
      src: url('./fonts/AppleColorEmoji.ttf') format('truetype'),
           url('/fonts/AppleColorEmoji.ttf') format('truetype'),
           url('fonts/AppleColorEmoji.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: var(--notif-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif), 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif !important;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 7px;
      padding: 0;
      margin: 0;
      background: transparent !important;
      justify-content: flex-end;
    }

    #root.top {
      justify-content: flex-start;
    }

    /* Telegram Desktop Style:
       - Width 356px, Height 82px
       - Sharp 0px corners
       - Dynamic Theme Background
       - No border, no shadow
       - 10px screen edge distance
       - Constant color (no change on hover)
    */
    .notif {
      width: 356px;
      min-height: 82px;
      height: 82px;
      border-radius: 0px !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      opacity: 0;
      transform: translateX(0);
      transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1), transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;

      background: var(--notif-bg, #1c182a) !important;
      color: var(--notif-text, #ffffff);
      font-family: inherit;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .notif.visible {
      opacity: 1;
      transform: translate(0, 0);
    }

    .notif.from-right  { transform: translateX(60px); }
    .notif.from-left   { transform: translateX(-60px); }
    .notif.from-top    { transform: translateY(-40px); }

    .notif.fade-out {
      opacity: 0 !important;
      transform: scale(0.96) !important;
      transition: opacity 160ms ease-out, transform 160ms ease-out !important;
    }

    .notif.slide-out-right {
      opacity: 0 !important;
      transform: translateX(380px) !important;
      transition: opacity 180ms ease-out, transform 180ms ease-out !important;
    }

    .notif.slide-out-left {
      opacity: 0 !important;
      transform: translateX(-380px) !important;
      transition: opacity 180ms ease-out, transform 180ms ease-out !important;
    }

    .notif.slide-out-top {
      opacity: 0 !important;
      transform: translateY(-82px) !important;
      transition: opacity 180ms ease-out, transform 180ms ease-out !important;
    }

    .notif-body {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 40px 11px 11px;
      width: 100%;
      height: 100%;
    }

    .notif-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
    }

    .notif-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .notif-avatar video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .notif-avatar svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .notif-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .notif-title {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--notif-text, #ffffff);
      font-family: inherit;
    }

    .notif-message {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--notif-subtext, #a89ec4);
      font-family: inherit;
      word-break: break-word;
    }

    .hide-all-bar {
      width: 356px;
      min-height: 38px;
      height: 38px;
      border-radius: 0px !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      background: var(--notif-bg, #1c182a) !important;
      color: var(--notif-subtext, #8b83a8);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.1px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 160ms ease, transform 160ms ease, color 120ms ease;
      flex-shrink: 0;
      pointer-events: auto !important;
      z-index: 100;
    }

    .hide-all-bar.visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .hide-all-bar:hover {
      color: var(--notif-text, #ffffff);
    }

    #notifs-container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 7px;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .notif-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: none !important;
      background: transparent !important;
      color: var(--notif-subtext, #8b83a8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.75;
      transition: opacity 120ms ease, color 120ms ease, background-color 120ms ease;
      z-index: 99;
      outline: none !important;
      box-shadow: none !important;
      pointer-events: auto !important;
    }

    .notif-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.08) !important;
      color: var(--notif-text, #ffffff);
    }

    .notif-close svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="hide-all-bar" class="hide-all-bar" role="button" tabindex="-1" aria-label="Скрыть все">
      <span id="hide-all-text">Скрыть все</span>
    </div>
    <div id="notifs-container"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let settings = {
      position: 'bottom-right',
      theme: 'dark',
      hideContent: false,
      maxCount: 3,
    };

    const activeNotifs = [];
    let nextId = 0;
    let iconData = null;
    let isHovering = false;

    const NOTIF_TIMEOUT_MS = 5500;

    ipcRenderer.on('notif:icon-data', (_event, data) => {
      iconData = data;
    });

    function getAnimClass(position) {
      if (position.includes('right')) return 'from-right';
      if (position.includes('left'))  return 'from-left';
      if (position.includes('center') || position.startsWith('top')) return 'from-top';
      return 'from-right';
    }

    function getExitAnimClass(position) {
      if (position.includes('right')) return 'slide-out-right';
      if (position.includes('left'))  return 'slide-out-left';
      if (position.includes('center')) return 'slide-out-top';
      return 'slide-out-right';
    }

    function applyStackDirection(position) {
      const root = document.getElementById('root');
      root.style.flexDirection = 'column';
      if (position.startsWith('top')) {
        root.style.justifyContent = 'flex-start';
        root.classList.add('top');
      } else {
        root.style.justifyContent = 'flex-end';
        root.classList.remove('top');
      }
    }

    function updateHideAllVisibility() {
      const hideAllBar = document.getElementById('hide-all-bar');
      if (!hideAllBar) return;
      if (activeNotifs.length >= 2) {
        hideAllBar.style.display = 'flex';
        requestAnimationFrame(() => {
          hideAllBar.classList.add('visible');
        });
      } else {
        hideAllBar.classList.remove('visible');
        setTimeout(() => {
          if (activeNotifs.length < 2) {
            hideAllBar.style.display = 'none';
          }
        }, 180);
      }
    }

    function removeNotifInstant(id, animation = 'fade-out', immediate = false) {
      const idx = activeNotifs.findIndex(n => n.id === id);
      if (idx === -1) return;
      const notifObj = activeNotifs[idx];
      if (notifObj.timer) clearTimeout(notifObj.timer);
      activeNotifs.splice(idx, 1);
      updateHideAllVisibility();

      if (immediate) {
        notifObj.el.remove();
        if (activeNotifs.length === 0) {
          ipcRenderer.send('notif-window:all-closed');
        }
      } else {
        notifObj.el.classList.add(animation);
        setTimeout(() => {
          notifObj.el.remove();
          if (activeNotifs.length === 0) {
            ipcRenderer.send('notif-window:all-closed');
          }
        }, 180);
      }
    }

    function clearAllNotifications() {
      const list = [...activeNotifs];
      list.forEach(n => removeNotifInstant(n.id, 'fade-out', true));
      updateHideAllVisibility();
      ipcRenderer.send('notif-window:all-closed');
    }

    function removeOldestNotification() {
      if (activeNotifs.length > 0) {
        removeNotifInstant(activeNotifs[0].id, getExitAnimClass(settings.position));
      }
    }

    function getLetterAvatar(name, accentColor = '#9b7dd4') {
      const initial = (name && String(name).trim().length > 0) ? String(name).trim().charAt(0).toUpperCase() : 'O';
      return `
        <div style="width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg, ${accentColor}, #3c2468);display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:24px;font-weight:700;user-select:none;">
          ${escapeHtml(initial)}
        </div>
      `;
    }

    function getDefaultAvatarSvg(accentColor = '#9b7dd4', accentLight = '#b89fee') {
      return `
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="planeBg" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#382d56" />
              <stop offset="100%" stop-color="#1e182e" />
            </radialGradient>
          </defs>
          <circle cx="30" cy="30" r="30" fill="url(#planeBg)" />
          <path d="M30 0 L33 30 L27 30 Z" fill="rgba(155,125,212,0.15)" />
          <path d="M10 10 L30 30 L23 33 Z" fill="rgba(155,125,212,0.10)" />
          <path d="M50 10 L37 33 L30 30 Z" fill="rgba(155,125,212,0.10)" />
          <path d="M16 41 L30 16 L26 35 Z" fill="${accentLight}" />
          <path d="M44 41 L30 16 L34 35 Z" fill="#e8deff" />
          <path d="M30 16 L26 35 L34 35 Z" fill="#ffffff" />
          <path d="M26 35 L30 41 L34 35 Z" fill="${accentColor}" />
        </svg>
      `;
    }

    function showNotification({ id, title, body, chatId, position, theme, hideContent, colors, fontFamily, soundEnabled, volume, avatarUrl }) {
      const root = document.getElementById('root');
      applyStackDirection(position);

      const accent = colors?.accent || '#9b7dd4';
      const accentLight = colors?.accentLight || '#b89fee';

      if (colors) {
        if (colors.accent)      document.documentElement.style.setProperty('--notif-accent', colors.accent);
        if (colors.accentLight) document.documentElement.style.setProperty('--notif-accent-light', colors.accentLight);
        if (colors.bg)          document.documentElement.style.setProperty('--notif-bg', colors.bg);
        if (colors.text)        document.documentElement.style.setProperty('--notif-text', colors.text);
        if (colors.textDim)     document.documentElement.style.setProperty('--notif-subtext', colors.textDim);
      }

      if (fontFamily) {
        document.documentElement.style.setProperty('--notif-font', fontFamily);
      } else {
        document.documentElement.style.removeProperty('--notif-font');
      }

      // Воспроизводим звук с учетом заданной громкости
      if (soundEnabled) {
        try {
          const audio = new Audio('./sounds/notification.mp3');
          const vol = typeof volume === 'number' ? Math.max(0, Math.min(1, volume / 100)) : 1.0;
          audio.volume = vol;
          audio.play().catch(() => {
            try {
              const fallbackAudio = new Audio('/sounds/notification.mp3');
              fallbackAudio.volume = vol;
              fallbackAudio.play().catch(() => {});
            } catch (_) {}
          });
        } catch (err) {
          console.warn('[Notification] Failed to play sound:', err);
        }
      }

      // Если количество активных уведомлений достигло maxCount, удаляем старое
      while (activeNotifs.length >= settings.maxCount) {
        removeOldestNotification();
      }

      const animClass = getAnimClass(position);
      const themeClass = theme === 'light' ? 'theme-light' : 'theme-dark';

      const isHidden = Boolean(hideContent);
      const finalTitle = title || 'Orbita Desktop';
      const finalBody  = body || 'Новое сообщение';

      let avatarHtml;
      if (isHidden) {
        avatarHtml = `<img src="./icons/128x128.png" alt="Orbita" style="width:60px;height:60px;object-fit:contain;display:block;" onerror="this.onerror=null;this.src='/icons/128x128.png';" />`;
      } else if (avatarUrl && typeof avatarUrl === 'string' && avatarUrl.trim() !== '') {
        // Если имя НЕ скрыто и есть реальная аватарка пользователя:
        const cleanUrl = avatarUrl.split('?')[0];
        const ext = cleanUrl.split('.').pop().toLowerCase();
        const isVideo = ['mp4', 'mov', 'avi', 'webm', 'mkv', 'm4v'].includes(ext);
        if (isVideo) {
          avatarHtml = `<video src="${avatarUrl}" autoplay muted loop playsinline></video>`;
        } else {
          avatarHtml = `<img src="${avatarUrl}" alt="Avatar" onerror="this.onerror=null;this.parentElement.innerHTML=getLetterAvatar('${escapeHtml(finalTitle)}','${accent}');" />`;
        }
      } else {
        // Если имя НЕ скрыто, но у пользователя нет своей аватарки: показываем аватарку с первой буквой как в Telegram
        avatarHtml = getLetterAvatar(finalTitle, accent);
      }

      const el = document.createElement('div');
      el.className = `notif ${themeClass} ${animClass}`;
      el.dataset.id = String(id);

      el.innerHTML = `
        <div class="notif-body">
          <div class="notif-avatar">${avatarHtml}</div>
          <div class="notif-content">
            <div class="notif-title">${escapeHtml(finalTitle)}</div>
            <div class="notif-message">${escapeHtml(finalBody)}</div>
          </div>
        </div>
        <div class="notif-close" role="button" tabindex="-1" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      `;

      const notifObj = {
        id,
        el,
        timer: null,
        expiresAt: Date.now() + NOTIF_TIMEOUT_MS,
      };

      const startTimer = () => {
        if (notifObj.timer) clearTimeout(notifObj.timer);
        notifObj.timer = setTimeout(() => {
          if (!isHovering) {
            removeNotifInstant(id, getExitAnimClass(position));
          }
        }, NOTIF_TIMEOUT_MS);
      };

      startTimer();

      el.addEventListener('mouseenter', () => {
        isHovering = true;
        activeNotifs.forEach(n => {
          if (n.timer) clearTimeout(n.timer);
        });
      });

      el.addEventListener('mouseleave', () => {
        isHovering = false;
        activeNotifs.forEach(n => {
          n.timer = setTimeout(() => {
            removeNotifInstant(n.id, getExitAnimClass(position));
          }, 3500);
        });
      });

      const bodyEl = el.querySelector('.notif-body');
      bodyEl.addEventListener('click', () => {
        ipcRenderer.send('notif-window:clicked', { chatId });
        removeNotifInstant(id, 'fade-out', true);
      });

      const closeBtn = el.querySelector('.notif-close');
      const handleClose = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        removeNotifInstant(id, 'fade-out', true);
      };
      closeBtn.addEventListener('pointerdown', handleClose);
      closeBtn.addEventListener('mousedown', handleClose);
      closeBtn.addEventListener('click', handleClose);

      const container = document.getElementById('notifs-container') || root;
      container.appendChild(el);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          el.classList.remove(animClass);
          el.classList.add('visible');
        });
      });

      activeNotifs.push(notifObj);
      updateHideAllVisibility();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const hideAllBarEl = document.getElementById('hide-all-bar');
    if (hideAllBarEl) {
      const handleHideAll = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        clearAllNotifications();
      };
      hideAllBarEl.addEventListener('click', handleHideAll);
      hideAllBarEl.addEventListener('pointerdown', handleHideAll);
      hideAllBarEl.addEventListener('mousedown', handleHideAll);
    }

    ipcRenderer.on('notif:show', (_event, payload) => {
      settings = {
        position:    payload.position    || 'bottom-right',
        theme:       payload.theme       || 'dark',
        hideContent: payload.hideContent || false,
        maxCount:    payload.maxCount    || 3,
      };

      if (payload.hideAllText) {
        const txtEl = document.getElementById('hide-all-text');
        if (txtEl) txtEl.textContent = payload.hideAllText;
        if (hideAllBarEl) hideAllBarEl.setAttribute('aria-label', payload.hideAllText);
      }

      showNotification({
        id:          nextId++,
        title:       payload.title,
        body:        payload.body,
        chatId:      payload.chatId,
        position:    settings.position,
        theme:       settings.theme,
        hideContent: settings.hideContent,
        colors:      payload.colors,
        fontFamily:  payload.fontFamily,
        soundEnabled: payload.soundEnabled,
        volume:      payload.volume,
        avatarUrl:   payload.avatarUrl,
      });
    });

    ipcRenderer.on('notif:clear-all', () => {
      clearAllNotifications();
    });
  </script>
</body>
</html>
