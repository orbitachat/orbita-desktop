<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-app-region: drag;
    }
    .splash-card {
      width: 296px;
      height: 336px;
      border-radius: 8px;
      background: #121212;
      border: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }
    .logo-container {
      width: 160px;
      height: 160px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.92);
      animation: logo-reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes logo-reveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .status-text {
      margin-top: 22px;
      font-size: 13.5px;
      font-weight: 500;
      color: #8e8e93;
      text-align: center;
      letter-spacing: 0.2px;
      height: 20px;
      line-height: 20px;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
        <defs>
          <clipPath id="front-clip">
            <rect x="-600" y="0" width="1200" height="600" />
          </clipPath>
          <mask id="back-ring-mask">
            <rect x="0" y="0" width="800" height="800" fill="white" />
            <circle cx="400" cy="400" r="192" fill="black" />
          </mask>
          <mask id="planet-mask">
            <rect x="0" y="0" width="800" height="800" fill="white" />
            <g transform="translate(400, 400) rotate(-26)">
              <path d="M 224 0 A 224 59 0 0 1 -224 0 L -376 0 A 376 121 0 0 0 376 0 Z" fill="black" />
            </g>
          </mask>
          <mask id="ring-hole">
            <rect x="-600" y="-600" width="1200" height="1200" fill="white" />
            <ellipse cx="0" cy="0" rx="240" ry="75" fill="black" />
          </mask>
          <mask id="rotating-gap">
            <rect x="0" y="0" width="800" height="800" fill="white" />
            <g>
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="-26 400 400"
                to="334 400 400"
                dur="1s"
                repeatCount="indefinite" />
              <path d="M 400 400 L 400 -200 A 600 600 0 0 1 824.26 -24.26 Z" fill="black" />
            </g>
          </mask>
        </defs>
        <g mask="url(#rotating-gap)">
          <rect x="0" y="0" width="800" height="800" fill="transparent" pointer-events="none" />
          <g mask="url(#back-ring-mask)">
            <g transform="translate(400, 400) rotate(-26)">
              <ellipse cx="0" cy="0" rx="360" ry="105" fill="#BCC0C3" mask="url(#ring-hole)" />
            </g>
          </g>
        </g>
        <circle cx="400" cy="400" r="175" fill="#BCC0C3" mask="url(#planet-mask)" />
        <g mask="url(#rotating-gap)">
          <rect x="0" y="0" width="800" height="800" fill="transparent" pointer-events="none" />
          <g transform="translate(400, 400) rotate(-26)">
            <g clip-path="url(#front-clip)">
              <ellipse cx="0" cy="0" rx="360" ry="105" fill="#BCC0C3" mask="url(#ring-hole)" />
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div id="status-text" class="status-text">Проверка обновлений...</div>
  </div>
  <script>
    window.setStatus = function(text) {
      var el = document.getElementById('status-text');
      if (el) el.textContent = text;
    };
  </script>
</body>
</html>
