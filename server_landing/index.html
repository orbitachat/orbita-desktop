<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orbita Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0b14;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      --accent: #7c54cc;
      --accent-hover: #9066e0;
      --box-bg: rgba(255, 255, 255, 0.07);
      --box-bg-hover: rgba(255, 255, 255, 0.11);
      --code-color: #c4b5fd;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }
    .ambient-light {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 84, 204, 0.12) 0%, rgba(14, 11, 20, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .header {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(14, 11, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }
    .logo-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .btn-download {
      background: var(--accent);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-download:hover {
      background: var(--accent-hover);
    }
    .btn-download:active {
      transform: scale(0.97);
    }
    .main-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .center-logo {
      margin-bottom: 24px;
    }
    .main-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .main-subtitle {
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .id-box {
      width: 100%;
      background: var(--box-bg);
      border-radius: 10px;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: all;
      -webkit-user-select: all;
    }
    .id-box:hover {
      background: var(--box-bg-hover);
    }
    .id-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--code-color);
      letter-spacing: 0.08em;
      line-height: 1.5;
      word-break: break-all;
    }
    .id-hint {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-open {
      margin-top: 20px;
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-open:hover {
      background: var(--accent-hover);
    }
    .btn-open:active {
      transform: scale(0.98);
    }
    .btn-copy {
      margin-top: 10px;
      width: 100%;
      background: var(--box-bg);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:hover {
      background: var(--box-bg-hover);
    }
    .toast {
      position: fixed;
      bottom: 28px;
      background: #1f1b2b;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 600px) {
      .header { padding: 0 16px; }
      .main-title { font-size: 21px; }
      .id-text { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="ambient-light"></div>

  <header class="header">
    <a href="#" class="logo-group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="32" height="32">
        <defs>
          <clipPath id="h-front-clip"><rect x="-600" y="0" width="1200" height="600" /></clipPath>
          <mask id="h-back-ring-mask"><rect x="0" y="0" width="800" height="800" fill="white" /><circle cx="400" cy="400" r="192" fill="black" /></mask>
          <mask id="h-planet-mask"><rect x="0" y="0" width="800" height="800" fill="white" /><g transform="translate(400, 400) rotate(-26)"><path d="M 224 0 A 224 59 0 0 1 -224 0 L -376 0 A 376 121 0 0 0 376 0 Z" fill="black" /></g></mask>
          <mask id="h-ring-hole"><rect x="-600" y="-600" width="1200" height="1200" fill="white" /><ellipse cx="0" cy="0" rx="240" ry="75" fill="black" /></mask>
          <linearGradient id="h-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#38bdf8" />
          </linearGradient>
        </defs>
        <g mask="url(#h-back-ring-mask)"><g transform="translate(400, 400) rotate(-26)"><ellipse cx="0" cy="0" rx="360" ry="105" fill="url(#h-grad)" mask="url(#h-ring-hole)" /></g></g>
        <circle cx="400" cy="400" r="175" fill="url(#h-grad)" mask="url(#h-planet-mask)" />
        <g transform="translate(400, 400) rotate(-26)"><g clip-path="url(#h-front-clip)"><ellipse cx="0" cy="0" rx="360" ry="105" fill="url(#h-grad)" mask="url(#h-ring-hole)" /></g></g>
      </svg>
      <span class="logo-title">Orbita Messenger</span>
    </a>
    <a id="downloadBtn" href="https://github.com/" class="btn-download">Скачать Orbita</a>
  </header>

  <main class="main-container">
    <div class="center-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="84" height="84">
        <defs>
          <clipPath id="c-front-clip"><rect x="-600" y="0" width="1200" height="600" /></clipPath>
          <mask id="c-back-ring-mask"><rect x="0" y="0" width="800" height="800" fill="white" /><circle cx="400" cy="400" r="192" fill="black" /></mask>
          <mask id="c-planet-mask"><rect x="0" y="0" width="800" height="800" fill="white" /><g transform="translate(400, 400) rotate(-26)"><path d="M 224 0 A 224 59 0 0 1 -224 0 L -376 0 A 376 121 0 0 0 376 0 Z" fill="black" /></g></mask>
          <mask id="c-ring-hole"><rect x="-600" y="-600" width="1200" height="1200" fill="white" /><ellipse cx="0" cy="0" rx="240" ry="75" fill="black" /></mask>
          <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#38bdf8" />
          </linearGradient>
        </defs>
        <g mask="url(#c-back-ring-mask)"><g transform="translate(400, 400) rotate(-26)"><ellipse cx="0" cy="0" rx="360" ry="105" fill="url(#c-grad)" mask="url(#c-ring-hole)" /></g></g>
        <circle cx="400" cy="400" r="175" fill="url(#c-grad)" mask="url(#c-planet-mask)" />
        <g transform="translate(400, 400) rotate(-26)"><g clip-path="url(#c-front-clip)"><ellipse cx="0" cy="0" rx="360" ry="105" fill="url(#c-grad)" mask="url(#c-ring-hole)" /></g></g>
      </svg>
    </div>

    <h1 class="main-title">Ваш друг приглашает создать личный чат!</h1>
    <p class="main-subtitle">Вы можете скопировать ID или подключиться к чату автоматически.</p>

    <div class="id-box" id="idBox">
      <div class="id-text" id="idText">------------------------------------</div>
      <div class="id-hint">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span>Нажмите, чтобы скопировать ID</span>
      </div>
    </div>

    <a id="openAppBtn" href="#" class="btn-open">
      <span>Открыть в Orbita</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>

    <button id="copyLinkBtn" class="btn-copy">Скопировать ссылку</button>
  </main>

  <div id="toast" class="toast">ID скопирован в буфер!</div>

  <script>
    function detectOS() {
      const ua = navigator.userAgent || '';
      if (/android/i.test(ua)) return 'Android';
      if (/iphone|ipad|ipod/i.test(ua)) return 'iOS';
      if (/macintosh|mac os x/i.test(ua)) return 'macOS';
      if (/windows|win32|win64/i.test(ua)) return 'Windows';
      if (/linux/i.test(ua)) return 'Linux';
      return '';
    }

    const os = detectOS();
    const dlBtn = document.getElementById('downloadBtn');
    if (os) {
      dlBtn.textContent = 'Скачать на ' + os;
    } else {
      dlBtn.textContent = 'Скачать Orbita';
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function getTarget() {
      const url = new URL(window.location.href);
      const pathname = url.pathname;
      const groupMatch = pathname.match(/\/(?:g|group|join|invite)(?:\/group)?\/([^\/?#]+)/i);
      if (groupMatch && groupMatch[1]) {
        return { type: 'group', code: decodeURIComponent(groupMatch[1]).trim() };
      }
      const userMatch = pathname.match(/\/u\/([^\/?#]+)/i);
      if (userMatch && userMatch[1]) {
        return { type: 'user', code: decodeURIComponent(userMatch[1]).trim() };
      }
      const gParam = url.searchParams.get('group');
      if (gParam) {
        return { type: 'group', code: gParam.trim() };
      }
      const q = url.searchParams.get('code') || url.searchParams.get('id') || url.searchParams.get('token') || '';
      if (q.trim()) {
        if (q.trim().length === 54) {
          return { type: 'group', code: q.trim() };
        }
        return { type: 'user', code: q.trim() };
      }
      return null;
    }

    const target = getTarget();
    let deepLink = '';
    let cleanCode = '';

    if (target && target.type === 'group') {
      cleanCode = target.code;
      const params = new URLSearchParams(window.location.search);
      const groupName = params.get('name');
      const groupCreator = params.get('creator');
      const groupAvatar = params.get('avatar');
      const extraParams = new URLSearchParams();
      if (groupName) extraParams.set('name', groupName);
      if (groupCreator) extraParams.set('creator', groupCreator);
      if (groupAvatar) extraParams.set('avatar', groupAvatar);
      const extraQs = extraParams.toString();
      deepLink = 'orbita://join/group/' + encodeURIComponent(cleanCode) + (extraQs ? '?' + extraQs : '');

      const titleEl = document.querySelector('.main-title');
      const subEl = document.querySelector('.main-subtitle');
      if (titleEl) {
        titleEl.textContent = groupName ? ('Приглашение в группу «' + groupName + '»') : 'Приглашение в группу';
      }
      if (subEl) {
        subEl.textContent = groupCreator ? ('Создатель: ' + groupCreator) : 'Присоединяйтесь к зашифрованной группе в Orbita';
      }
    } else if (target && target.type === 'user') {
      cleanCode = target.code;
      deepLink = 'orbita://connect?code=' + encodeURIComponent(cleanCode);
    } else {
      cleanCode = 'W8C17R1XDS3D3GCJGCT7P8A5G5WMIK6TGFG4';
      deepLink = 'orbita://connect?code=' + encodeURIComponent(cleanCode);
    }

    const idTextEl = document.getElementById('idText');
    if (cleanCode.length >= 36) {
      const part1 = cleanCode.slice(0, 18);
      const part2 = cleanCode.slice(18);
      idTextEl.innerHTML = part1 + '<br>' + part2;
    } else {
      idTextEl.textContent = cleanCode;
    }

    const openBtn = document.getElementById('openAppBtn');
    openBtn.href = deepLink;
    openBtn.addEventListener('click', function() {
      window.location.href = deepLink;
    });

    document.getElementById('idBox').addEventListener('click', function() {
      navigator.clipboard.writeText(cleanCode).then(() => showToast('ID скопирован в буфер!'));
    });

    document.getElementById('copyLinkBtn').addEventListener('click', function() {
      navigator.clipboard.writeText(window.location.href).then(() => showToast('Ссылка скопирована в буфер!'));
    });

    setTimeout(function() {
      if (target) {
        try {
          window.location.href = deepLink;
        } catch(e) {}
      }
    }, 600);
  </script>
</body>
</html>
